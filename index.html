<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Terminal SIM: Linux CLI</title>
<style>
:root{
  --bg:#0b0f14;--panel:#121923;--panel2:#18222f;--line:#243142;--text:#d7e0ea;--mute:#8497ab;
  --accent:#3ddc84;--accent2:#5ac8fa;--warn:#ffb454;--bad:#ff6b6b;--term:#05080c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:700;color:var(--accent);letter-spacing:.5px}
.logo small{color:var(--mute);font-weight:400;margin-left:8px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mute);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--panel2);color:var(--text)}
nav button:hover{color:var(--text)}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.bar{width:140px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.ghost{background:none;border:1px solid var(--line);color:var(--mute);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.ghost:hover{color:var(--text);border-color:var(--mute)}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex}

/* training */
#side{width:250px;border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel);flex:none}
.mod{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit}
.mod:hover{background:var(--panel2)}
.mod.on{background:var(--panel2);outline:1px solid var(--line)}
.mod .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--line);color:var(--mute);font-family:var(--mono)}
.mod.done .n{background:var(--accent);color:#04210f;border-color:var(--accent)}
.mod b{display:block;font-weight:600;font-size:14px}
.mod span.s{display:block;font-size:12px;color:var(--mute)}
#lesson{width:42%;min-width:320px;overflow:auto;padding:22px 24px;border-right:1px solid var(--line)}
#lesson h2{margin:0 0 4px;font-size:22px}
#lesson .sub{color:var(--mute);margin:0 0 16px}
#lesson h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin:22px 0 8px}
#lesson p{margin:0 0 12px}
#lesson ul{padding-left:20px;margin:0 0 12px}
#lesson li{margin-bottom:4px}
code{font-family:var(--mono);font-size:13px;background:var(--panel2);padding:1px 6px;border-radius:5px}
code.cmd{cursor:pointer;color:var(--accent);border:1px solid transparent}
code.cmd:hover{border-color:var(--accent)}
pre.blk{background:var(--term);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:13px;margin:0 0 12px;white-space:pre-wrap}
pre.blk .cmd{cursor:pointer;display:block;color:var(--accent)}
pre.blk .cmd:hover{background:var(--panel2)}
.note{border-left:3px solid var(--warn);background:rgba(255,180,84,.08);padding:8px 12px;border-radius:0 8px 8px 0;margin:0 0 12px}
.note.ok{border-color:var(--accent);background:rgba(61,220,132,.07)}
.tasks{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:6px 12px;margin-top:18px}
.task{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:13px;color:#04210f}
.task.done .ck{background:var(--accent);border-color:var(--accent)}
.task.done .tx{color:var(--mute);text-decoration:line-through}
.hintb{margin-left:auto;flex:none;font-size:12px}
.hint{display:none;font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:2px}
.hint.show{display:block}
.pager{display:flex;gap:8px;margin-top:18px}
.btn{background:var(--accent);color:#04210f;border:0;padding:8px 16px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* terminal */
#termwrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--term)}
.tbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--mute)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
#term{flex:1;overflow:auto;padding:12px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.45;cursor:text}
#term .ln{white-space:pre-wrap;word-break:break-word;min-height:1.45em}
#term .err{color:var(--bad)}
#term .dim{color:var(--mute)}
.cd{color:#6aa9ff;font-weight:700}.cx{color:var(--accent);font-weight:700}.cw{color:var(--warn)}.cg{color:var(--accent)}.cc{color:var(--accent2)}.cb{font-weight:700}.cr{color:var(--bad)}
.prompt{color:var(--accent)}
#inrow{display:flex;gap:8px;white-space:pre}
#inp{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:0;min-width:0}
.keys{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.keys button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px 11px;font:12px var(--mono);cursor:pointer}
.keys button:hover{border-color:var(--accent)}

/* editor */
#ed{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:20;padding:16px}
#ed.on{display:grid}
#edbox{width:min(760px,100%);height:min(520px,90vh);background:var(--term);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#edbox .h{padding:8px 14px;background:#e8e8e8;color:#111;font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between}
#edta{flex:1;background:var(--term);color:var(--text);border:0;outline:0;resize:none;padding:12px;font:13.5px/1.45 var(--mono);tab-size:4}
#edbox .f{padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:12px;color:var(--mute)}
#edmsg{margin-left:auto;color:var(--accent)}

/* reference / quiz / generic page */
.page{flex:1;overflow:auto;padding:24px;max-width:1000px;margin:0 auto;width:100%}
.page h2{margin:0 0 4px}
input.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;font:inherit;margin:12px 0 18px}
.cat{margin-bottom:22px}
.cat h3{margin:0 0 8px;color:var(--accent2);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.row{display:grid;grid-template-columns:minmax(180px,34%) 1fr;gap:12px;padding:7px 10px;border-bottom:1px solid var(--line)}
.row code{background:none;color:var(--accent);padding:0}
.row span{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:10px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt.right{border-color:var(--accent);background:rgba(61,220,132,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12)}
.expl{margin-top:10px;color:var(--mute)}
.score{font-size:42px;font-weight:700;color:var(--accent)}

@media (max-width:980px){
  #side{display:none}
  .view#v-train.on{flex-direction:column;overflow:auto}
  #lesson{width:100%;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  #termwrap{min-height:480px}
  main{overflow:auto}
}
@media (max-width:620px){.row{grid-template-columns:1fr}.prog .bar{width:80px}}
</style>

<body>

  <div class="logo">$ terminal-trainer<small>Linux CLI basics · training sim</small></div>
  <nav id="nav">
    <button data-v="train" class="on">Training</button>

      <div id="term"></div>

<div id="ed"><div id="edbox">
  <div class="h"><span>GNU nano 8.2</span><span id="edname"></span><span id="edmod"></span></div>
  <textarea id="edta" spellcheck="false"></textarea>

</div></div>

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const M=(c,t)=>'\u0001'+c+t+'\u0002';
const strip=s=>s.replace(/\u0001.([^\u0002]*)\u0002/g,'$1');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const HOME='/data/data/com.termux/files/home', PREFIX='/data/data/com.termux/files/usr';
const hex=n=>[...Array(n)].map(()=>Math.floor(Math.random()*16).toString(16)).join('');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= package database ================= */
const PKGS={
 git:['2.47.1','Fast, scalable, distributed revision control system'],
 python:['3.12.8','Python 3 programming language intended to enable clear programs'],
 openssh:['9.9p1','Secure shell for logging into a remote machine'],
 nodejs:['22.12.0','Open Source, cross-platform JavaScript runtime environment'],
 clang:['19.1.6','C language family frontend for LLVM'],
 make:['4.4.1','Tool to control the generation of non-source files from sources'],
 cmake:['3.31.2','Family of tools designed to build, test and package software'],
 nmap:['7.95','Utility for network discovery and security auditing'],
 htop:['3.3.0','Interactive process viewer'],
 neofetch:['7.1.0','Command-line system information tool'],
 tree:['2.1.3','Recursive directory listing command'],
 vim:['9.1.0900','Vi IMproved - enhanced vi editor'],
 wget:['1.25.0','Network utility to retrieve files from the Web'],
 zsh:['5.9','Shell with lots of features'],
 tmux:['3.5a','Terminal multiplexer'],
 figlet:['2.2.5','Make large letters out of ordinary text'],
 cowsay:['3.8.4','Configurable talking cow'],
 'net-tools':['2.10','Configuration tools for Linux networking (ifconfig, netstat)'],
 'termux-api':['0.59.1','Termux API commands for Android hardware access'],
 'openssl-tool':['3.4.0','OpenSSL command line tool'],
 proot:['5.1.107','Emulate chroot, bind mount and binfmt_misc for non-root users'],
 'proot-distro':['4.19.0','Termux utility for managing Linux distributions'],
 ruby:['3.3.6','Dynamic programming language'],
 golang:['1.23.4','Go programming language'],
 rust:['1.83.0','Systems programming language'],
 jq:['1.7.1','Command-line JSON processor'],
 ffmpeg:['7.1','Tools and libraries to manipulate multimedia data'],
 fastfetch:['2.31.0','Fast neofetch-like system information tool'],
 zip:['3.0','Archiver for .zip files'],unzip:['6.0','Extractor for .zip files'],
 curl:['8.11.1','Command line tool for transferring data with URL syntax'],
 nano:['8.2','Small, free and friendly text editor'],
 'termux-tools':['1.45.0','Basic system tools for Termux'],
 coreutils:['9.5','Basic file, shell and text manipulation utilities'],
 grep:['3.11','Pattern matching utilities'],
 bash:['5.2.37','GNU command shell'],
};
const CMD2PKG={git:'git',python:'python',python3:'python',pip:'python',ssh:'openssh','ssh-keygen':'openssh',sshd:'openssh',scp:'openssh',node:'nodejs',npm:'nodejs',clang:'clang',gcc:'clang',cc:'clang',make:'make',cmake:'cmake',nmap:'nmap',htop:'htop',neofetch:'neofetch',tree:'tree',vim:'vim',wget:'wget',zsh:'zsh',tmux:'tmux',figlet:'figlet',cowsay:'cowsay',ifconfig:'net-tools',netstat:'net-tools','termux-battery-status':'termux-api','termux-toast':'termux-api','termux-vibrate':'termux-api',jq:'jq',zip:'zip',unzip:'unzip',ruby:'ruby',go:'golang',cargo:'rust',openssl:'openssl-tool',fastfetch:'fastfetch'};
const BASE_PKGS=['bash','coreutils','grep','nano','curl','termux-tools'];

/* ================= sandbox state ================= */
let S;
function dir(c){return {t:'d',m:'rwx------',c:c||{}}}
function file(d,m){return {t:'f',m:m||'rw-------',d:d||''}}
function newState(){
  const usr=dir({bin:dir(),etc:dir(),lib:dir(),share:dir()});
  const files=dir({home:dir(),usr});
  const fs=dir({data:dir({data:dir({'com.termux':dir({files})})}),sdcard:dir(),proc:dir(),system:dir()});
  fs.m='rwxr-xr-x';
  return {fs,cwd:HOME,pkgs:new Set(BASE_PKGS),env:{HOME,PREFIX,USER:'u0_a312',PATH:PREFIX+'/bin',SHELL:PREFIX+'/bin/bash',PWD:HOME,TERM:'xterm-256color',LANG:'en_US.UTF-8'},alias:{},hist:[],repos:{},gitcfg:{},storage:false,updated:false,sshd:false,passwd:false,started:Date.now()};
}
function resolve(p){
  if(p==='~'||p.startsWith('~/'))p=HOME+p.slice(1);
  if(!p.startsWith('/'))p=S.cwd+'/'+p;
  const out=[];for(const s of p.split('/')){if(!s||s==='.')continue;if(s==='..')out.pop();else out.push(s)}
  return '/'+out.join('/');
}
function getNode(abs){let n=S.fs;for(const s of abs.split('/').filter(Boolean)){if(n.t!=='d'||!n.c[s])return null;n=n.c[s]}return n}
function split(abs){const i=abs.lastIndexOf('/');const dp=abs.slice(0,i)||'/';return {dp,dir:getNode(dp),name:abs.slice(i+1)}}
function writeFile(abs,data,append){
  const {dir:d,name}=split(abs);
  if(!d||d.t!=='d')return 'No such file or directory';
  const ex=d.c[name];
  if(ex&&ex.t==='d')return 'Is a directory';
  if(ex&&append)ex.d+=data;else if(ex)ex.d=data;else d.c[name]=file(data);
  return null;
}
function walk(abs,fn,pre=''){const n=getNode(abs);if(!n||n.t!=='d')return;for(const k of Object.keys(n.c).sort()){fn(pre+k,n.c[k],abs+(abs==='/'?'':'/')+k);if(n.c[k].t==='d')walk(abs+(abs==='/'?'':'/')+k,fn,pre+k+'/')}}
function tilde(p){return p===HOME?'~':p.startsWith(HOME+'/')?'~'+p.slice(HOME.length):p}
function seedStorage(){
  const st=dir({});
  const sh=dir({Download:dir({'welcome.txt':file('Shared storage is now linked.\n','rw-r--r--'),'notes.md':file('# Notes\n- learn termux\n','rw-r--r--')}),DCIM:dir({}),Pictures:dir({}),Music:dir({}),Movies:dir({}),Documents:dir({})});
  S.fs.c.sdcard=sh;
  const home=getNode(HOME);
  st.c.shared=sh;st.c.downloads=sh.c.Download;st.c.dcim=sh.c.DCIM;st.c.pictures=sh.c.Pictures;st.c.music=sh.c.Music;st.c.movies=sh.c.Movies;
  home.c.storage=st;
}

/* ================= tokenizer / expansion ================= */
function tokenize(line){
  const toks=[];let cur='',has=false,sq=false,q=null;
  const push=()=>{if(has){toks.push({v:cur,sq});cur='';has=false;sq=false}};
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch===q){q=null}else cur+=ch; continue }
    if(ch==='"'||ch==="'"){q=ch;has=true;if(ch==="'")sq=true;continue}
    if(ch==='\\'&&i+1<line.length){cur+=line[++i];has=true;sq=true;continue}
    if(/\s/.test(ch)){push();continue}
    if(ch==='#'&&!has){break}
    if(ch==='|'||ch===';'||ch==='>'||ch==='&'){
      push();
      let op=ch;
      if(ch==='>'&&line[i+1]==='>'){op='>>';i++}
      else if(ch==='|'&&line[i+1]==='|'){op='||';i++}
      else if(ch==='&'&&line[i+1]==='&'){op='&&';i++}
      else if(ch==='&'){continue}
      toks.push({op});continue;
    }
    cur+=ch;has=true;
  }
  if(q)return {err:'unexpected EOF while looking for matching `'+q+"'"};
  push();return {toks};
}
function expandVar(s){return s.replace(/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/g,(m,k)=>S.env[k]!==undefined?S.env[k]:'')}
function glob(v){
  if(!v.includes('*')&&!v.includes('?'))return [v];
  const i=v.lastIndexOf('/');const dp=i>=0?v.slice(0,i+1):'';const pat=v.slice(i+1);
  const d=getNode(resolve(dp||'.'));if(!d||d.t!=='d')return [v];
  const re=new RegExp('^'+pat.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$');
  const m=Object.keys(d.c).filter(k=>re.test(k)&&(k[0]!=='.'||pat[0]==='.')).sort().map(k=>dp+k);
  return m.length?m:[v];
}
function expandTok(t){
  if(t.op)return [t.v];
  let v=t.v;
  if(!t.sq){ if(v==='~'||v.startsWith('~/'))v=HOME+v.slice(1); v=expandVar(v); return glob(v) }
  return [v];
}

/* ================= output ================= */
const term=$('#term');
function print(text,cls){
  const d=document.createElement('div');d.className='ln'+(cls?' '+cls:'');
  d.innerHTML=esc(text).replace(/\u0001(.)([^\u0002]*)\u0002/g,(m,c,t)=>`<span class="c${c}">${t}</span>`)||'&nbsp;';
  term.insertBefore(d,$('#inrow'));term.scrollTop=term.scrollHeight;
}
function printHTML(html){const d=document.createElement('div');d.className='ln';d.innerHTML=html;term.insertBefore(d,$('#inrow'));term.scrollTop=term.scrollHeight}
const slow=lines=>({__slow:lines});
function prompt(){return tilde(S.cwd)+' $ '}
function updatePrompt(){$('#pr').textContent=prompt()}

/* ================= editor (nano) ================= */
let edResolve=null,edPath=null,edDirty=false;
function openEditor(abs,name){
  return new Promise(res=>{
    edResolve=res;edPath=abs;edDirty=false;
    const n=getNode(abs);
    $('#edta').value=n&&n.t==='f'?n.d:'';
    $('#edname').textContent=name+(n?'':' (New File)');$('#edmod').textContent='';$('#edmsg').textContent='';
    $('#ed').classList.add('on');setTimeout(()=>$('#edta').focus(),30);
  });
}
function edSave(){
  const r=writeFile(edPath,$('#edta').value,false);
  $('#edmsg').textContent=r?('Error: '+r):('Wrote '+$('#edta').value.split('\n').length+' lines');
  if(!r){edDirty=false;$('#edmod').textContent=''}
}
function edExit(){
  if(edDirty&&!confirm('Save modified buffer?  OK = save, Cancel = discard'))edDirty=false;
  else if(edDirty)edSave();
  $('#ed').classList.remove('on');const r=edResolve;edResolve=null;r&&r('');setTimeout(()=>$('#inp').focus(),30);
}
$('#edta').addEventListener('input',()=>{edDirty=true;$('#edmod').textContent='Modified'});
$('#edsave').onclick=edSave;$('#edexit').onclick=edExit;
$('#edta').addEventListener('keydown',e=>{
  if(e.ctrlKey&&(e.key==='o'||e.key==='s')){e.preventDefault();edSave()}

/* ================= mini interpreters (python / js / C output) ================= */
function runScript(src,lang){
  const out=[];const vars={};
  const safe=/^[\w\s+\-*/().,%"'`{}\[\]<>=!&|:?]*$/;
  const evalExpr=(ex)=>{
    ex=ex.trim();
    let m;
    if(lang==='py'){
      if((m=ex.match(/^f(["'])(.*)\1$/)))return m[2].replace(/\{([^}]+)\}/g,(_,e)=>evalExpr(e));
      ex=ex.replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null').replace(/\*\*/g,'**').replace(/\/\//g,'/');
      ex=ex.replace(/\blen\(([^)]*)\)/g,'($1).length').replace(/\bstr\(/g,'String(').replace(/\bint\(/g,'parseInt(');
    }
    if(!safe.test(ex))throw new Error('unsupported expression in simulator');
    const f=new Function(...Object.keys(vars),'return ('+ex+')');
    const r=f(...Object.values(vars));
    return typeof r==='boolean'&&lang==='py'?(r?'True':'False'):r;
  };
  for(let raw of src.split('\n')){
    const l=raw.trim();if(!l||l[0]==='#'||l.startsWith('//'))continue;
    try{
      let m;
      if(lang==='py'&&(m=l.match(/^print\((.*)\)$/))){ out.push(m[1]===''?'':String(evalExpr(m[1]))); continue }
      if(lang==='js'&&(m=l.match(/^console\.log\((.*)\);?$/))){ out.push(m[1]===''?'':String(evalExpr(m[1]))); continue }
      if((m=l.match(/^(?:const |let |var )?([A-Za-z_]\w*)\s*=\s*(.+?);?$/))&&!/^(if|for|while)\b/.test(l)){ vars[m[1]]=evalExpr(m[2]); continue }
    }catch(e){out.push((lang==='py'?'Traceback (most recent call last):\n  ':'')+'Error: '+e.message);break}
  }
  return out.join('\n');
}
function cOutput(src){
  const out=[];const re=/printf\s*\(\s*"((?:[^"\\]|\\.)*)"/g;let m;
  while((m=re.exec(src)))out.push(m[1].replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\"/g,'"'));
  return out.join('').replace(/\n$/,'');
}

/* ================= git ================= */
function findRepo(){let p=S.cwd;while(true){if(S.repos[p])return p;if(p==='/')return null;p=p.slice(0,p.lastIndexOf('/'))||'/'}}
function snapshot(root){const o={};walk(root,(rel,n)=>{if(n.t==='f'&&!rel.startsWith('.git/'))o[rel]=n.d});return o}
function gitStatus(root,r){
  const work=snapshot(root),head=r.commits.length?r.commits[r.commits.length-1].files:{};
  const index=Object.assign({},head,r.staged);
  const lines=['On branch '+r.branch];
  if(!r.commits.length)lines.push('','No commits yet');
  const stg=Object.keys(r.staged).filter(k=>r.staged[k]!==head[k]);
  const mod=Object.keys(index).filter(k=>k in work&&work[k]!==index[k]);
  const del=Object.keys(index).filter(k=>!(k in work));
  const unt=Object.keys(work).filter(k=>!(k in index));
  if(stg.length){lines.push('','Changes to be committed:','  (use "git restore --staged <file>..." to unstage)');stg.forEach(k=>lines.push('\t'+M('g',(k in head?'modified:   ':'new file:   ')+k)))}
  if(mod.length||del.length){lines.push('','Changes not staged for commit:','  (use "git add <file>..." to update what will be committed)');mod.forEach(k=>lines.push('\t'+M('r','modified:   '+k)));del.forEach(k=>lines.push('\t'+M('r','deleted:    '+k)))}
  if(unt.length){lines.push('','Untracked files:','  (use "git add <file>..." to include in what will be committed)');unt.forEach(k=>lines.push('\t'+M('r',k)))}
  if(!stg.length&&!mod.length&&!del.length)lines.push('',unt.length?'nothing added to commit but untracked files present (use "git add" to track)':(r.commits.length?'nothing to commit, working tree clean':'nothing to commit (create/copy files and use "git add" to track)'));
  else if(!stg.length)lines.push('','no changes added to commit (use "git add" and/or "git commit -a")');
  return lines.join('\n');
}
function git(a){
  const sub=a[0];
  if(!sub||sub==='--help'||sub==='help')return 'usage: git [-v | --version] [-C <path>] <command> [<args>]\n\ncommon commands: init clone config add status commit log branch checkout remote push pull diff';
  if(sub==='--version'||sub==='version')return 'git version 2.47.1';
  if(sub==='config'){
    const rest=a.slice(1).filter(x=>x!=='--global');
    if(rest[0]==='--list'||rest[0]==='-l')return Object.entries(S.gitcfg).map(([k,v])=>k+'='+v).join('\n');
    if(rest.length===1)return S.gitcfg[rest[0]]||'';
    if(rest.length>=2){S.gitcfg[rest[0]]=rest.slice(1).join(' ');return ''}
    return 'usage: git config [<options>]';
  }
  if(sub==='init'){
    const target=a[1]?resolve(a[1]):S.cwd;
    if(a[1]){const r=mkdirp(target);if(r)return r}
    const n=getNode(target);n.c['.git']=dir({HEAD:file('ref: refs/heads/master\n'),config:file('[core]\n\trepositoryformatversion = 0\n')});
    S.repos[target]={branch:'master',commits:[],staged:{},remotes:{}};
    return 'Initialized empty Git repository in '+target+'/.git/';
  }
  if(sub==='clone'){
    if(!a[1])return 'fatal: You must specify a repository to clone.';
    const nm=(a[2]||a[1].replace(/\/$/,'').split('/').pop().replace(/\.git$/,''));const t=resolve(nm);
    if(getNode(t))return `fatal: destination path '${nm}' already exists and is not an empty directory.`;
    mkdirp(t);const n=getNode(t);
    n.c['README.md']=file('# '+nm+'\nCloned in the Termux training sim.\n','rw-r--r--');
    n.c['.git']=dir({});
    S.repos[t]={branch:'main',commits:[{id:hex(40),msg:'Initial commit',files:{'README.md':n.c['README.md'].d},t:Date.now()}],staged:{},remotes:{origin:a[1]}};
    return slow([`Cloning into '${nm}'...`,'remote: Enumerating objects: 12, done.','remote: Counting objects: 100% (12/12), done.','Receiving objects: 100% (12/12), 4.20 KiB | 2.10 MiB/s, done.','Resolving deltas: 100% (3/3), done.']);
  }
  const root=findRepo();
  if(!root)return 'fatal: not a git repository (or any of the parent directories): .git';
  const r=S.repos[root];
  if(sub==='status')return gitStatus(root,r);
  if(sub==='add'){
    if(!a[1])return 'Nothing specified, nothing added.\nhint: Maybe you wanted to say \'git add .\'?';
    const work=snapshot(root);
    for(const p of a.slice(1)){
      if(p==='.'||p==='-A'||p==='--all'){Object.assign(r.staged,work);}
      else{
        const abs=resolve(p);const rel=abs===root?'':abs.slice(root.length+1);
        const hit=Object.keys(work).filter(k=>k===rel||k.startsWith(rel+'/'));
        if(!hit.length)return `fatal: pathspec '${p}' did not match any files`;
        hit.forEach(k=>r.staged[k]=work[k]);
      }
    }
    return '';
  }
  if(sub==='commit'){
    const i=a.indexOf('-m');const all=a.includes('-am');
    const mi=i>=0?i:a.indexOf('-am');
    if(mi<0||!a[mi+1])return 'Aborting commit due to empty commit message. (use: git commit -m "message")';
    if(!S.gitcfg['user.name']||!S.gitcfg['user.email'])return '*** Please tell me who you are.\n\nRun\n\n  git config --global user.email "you@example.com"\n  git config --global user.name "Your Name"\n\nto set your account\'s default identity.\nfatal: unable to auto-detect email address';
    const head=r.commits.length?r.commits[r.commits.length-1].files:{};
    if(all){const w=snapshot(root);Object.keys(head).forEach(k=>{if(k in w)r.staged[k]=w[k]})}
    const stg=Object.keys(r.staged).filter(k=>r.staged[k]!==head[k]);
    if(!stg.length)return gitStatus(root,r);
    const files=Object.assign({},head,r.staged);
    const id=hex(40);r.commits.push({id,msg:a[mi+1],files,t:Date.now()});r.staged={};
    return `[${r.branch}${r.commits.length===1?' (root-commit)':''} ${id.slice(0,7)}] ${a[mi+1]}\n ${stg.length} file${stg.length>1?'s':''} changed`;
  }
  if(sub==='log'){
    if(!r.commits.length)return `fatal: your current branch '${r.branch}' does not have any commits yet`;
    const one=a.includes('--oneline');
    return r.commits.slice().reverse().map(c=>one?M('w',c.id.slice(0,7))+' '+c.msg:M('w','commit '+c.id)+`\nAuthor: ${S.gitcfg['user.name']||'?'} <${S.gitcfg['user.email']||'?'}>\nDate:   ${new Date(c.t).toString().slice(0,24)}\n\n    ${c.msg}\n`).join(one?'\n':'\n');
  }
  if(sub==='branch'){
    if(a[1]&&a[1][0]!=='-'){return ''}
    return '* '+M('g',r.branch);
  }
  if(sub==='checkout'||sub==='switch'){
    if(a[1]==='-b'||a[1]==='-c'){if(!a[2])return 'fatal: missing branch name';r.branch=a[2];return `Switched to a new branch '${a[2]}'`}
    return `Already on '${r.branch}'`;
  }
  if(sub==='remote'){
    if(a[1]==='add'){if(!a[3])return 'usage: git remote add <name> <url>';r.remotes[a[2]]=a[3];return ''}
    if(a[1]==='-v')return Object.entries(r.remotes).map(([k,v])=>`${k}\t${v} (fetch)\n${k}\t${v} (push)`).join('\n');
    return Object.keys(r.remotes).join('\n');
  }
  if(sub==='push'){
    if(!Object.keys(r.remotes).length)return `fatal: No configured push destination.\nEither specify the URL from the command-line or configure a remote repository using\n\n    git remote add <name> <url>`;
    return slow(['Enumerating objects: 3, done.','Counting objects: 100% (3/3), done.','Writing objects: 100% (3/3), 245 bytes | 245.00 KiB/s, done.','To '+Object.values(r.remotes)[0],' * [new branch]      '+r.branch+' -> '+r.branch,M('w','(simulated — real pushes need a GitHub token or SSH key; see Module 7)')]);
  }
  if(sub==='pull'||sub==='fetch')return 'Already up to date.';
  if(sub==='diff'){
    const head=r.commits.length?r.commits[r.commits.length-1].files:{};const w=snapshot(root);const o=[];
    Object.keys(w).filter(k=>k in head&&head[k]!==w[k]).forEach(k=>{o.push(M('w','diff --git a/'+k+' b/'+k));head[k].split('\n').forEach(l=>o.push(M('r','-'+l)));w[k].split('\n').forEach(l=>o.push(M('g','+'+l)))});
    return o.join('\n');
  }
  return `git: '${sub}' is not a git command in this simulator. See 'git --help'.`;
}
function mkdirp(abs){
  let n=S.fs;for(const s of abs.split('/').filter(Boolean)){ if(!n.c[s])n.c[s]=dir({}); else if(n.c[s].t!=='d')return 'File exists'; n=n.c[s]}
  return null;
}

function pkgCmd(name,a){
  const flags=a.filter(x=>x[0]==='-'),args=a.filter(x=>x[0]!=='-');
  const sub=args[0],rest=args.slice(1);
  if(!sub||sub==='help'||sub==='--help')return `Usage: ${name} command [arguments]\n\nCommands:\n  update / upgrade / install <pkg> / remove <pkg> / search <query>\n  list-installed / list-all / show <pkg> / autoclean / files <pkg>`;
  if(sub==='update'){S.updated=true;return slow(['Hit:1 https://packages.termux.dev/apt/termux-main stable InRelease','Get:2 https://packages.termux.dev/apt/termux-main stable/main aarch64 Packages [546 kB]','Fetched 546 kB in 2s (301 kB/s)','Reading package lists... Done','Building dependency tree... Done','All packages are up to date.']);}
  if(sub==='upgrade'||sub==='full-upgrade'){S.updated=true;return slow(['Reading package lists... Done','Building dependency tree... Done','Calculating upgrade... Done','The following packages will be upgraded:','  apt bash coreutils curl libandroid-support openssl termux-tools','7 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.','Need to get 8,240 kB of archives.','Get:1 https://packages.termux.dev/apt/termux-main stable/main aarch64 openssl aarch64 3.4.0 [1,980 kB]','Get:2 https://packages.termux.dev/apt/termux-main stable/main aarch64 curl aarch64 8.11.1 [310 kB]','Unpacking openssl (3.4.0) over (3.3.2) ...','Unpacking curl (8.11.1) over (8.10.1) ...','Setting up openssl (3.4.0) ...','Setting up curl (8.11.1) ...',M('g','Done — system up to date.')]);}
  if(sub==='install'||sub==='add'){
    if(!rest.length)return 'E: No packages specified';
    const lines=['Reading package lists... Done','Building dependency tree... Done'];const nw=[];
    for(const p of rest){
      if(!PKGS[p])return `E: Unable to locate package ${p}`;
      if(S.pkgs.has(p)){lines.push(`${p} is already the newest version (${PKGS[p][0]}).`);continue}
      nw.push(p);
    }
    if(nw.length){
      lines.push('The following NEW packages will be installed:','  '+nw.join(' '));
      lines.push(`0 upgraded, ${nw.length} newly installed, 0 to remove and 0 not upgraded.`,`Need to get ${(nw.length*3.7).toFixed(1)} MB of archives.`);
      nw.forEach((p,i)=>lines.push(`Get:${i+1} https://packages.termux.dev/apt/termux-main stable/main aarch64 ${p} aarch64 ${PKGS[p][0]} [${(2+i*1.3).toFixed(1)} MB]`));
      nw.forEach(p=>lines.push(`Unpacking ${p} (${PKGS[p][0]}) ...`));
      nw.forEach(p=>{lines.push(`Setting up ${p} (${PKGS[p][0]}) ...`);S.pkgs.add(p)});
      if(nw.includes('python'))S.pkgs.add('pip');
    }
    return slow(lines);
  }
  if(sub==='uninstall'||sub==='remove'||sub==='purge'){
    if(!rest.length)return 'E: No packages specified';
    const lines=[];for(const p of rest){ if(!S.pkgs.has(p)){lines.push(`Package '${p}' is not installed, so not removed`);continue} if(BASE_PKGS.includes(p)&&p!=='nano'){lines.push(`E: Refusing to remove essential package ${p}`);continue} S.pkgs.delete(p);lines.push(`Removing ${p} (${PKGS[p]?PKGS[p][0]:''}) ...`)}
    return slow(lines);
  }
  if(sub==='search'||sub==='find'){
    const q=(rest[0]||'').toLowerCase();if(!q)return 'E: search needs a keyword';
    const hits=Object.keys(PKGS).filter(k=>k.includes(q)||PKGS[k][1].toLowerCase().includes(q));
    if(!hits.length)return 'Sorting... Done\nFull Text Search... Done';
    return 'Sorting... Done\nFull Text Search... Done\n'+hits.map(k=>M('g',k)+'/stable '+PKGS[k][0]+' aarch64'+(S.pkgs.has(k)?' [installed]':'')+'\n  '+PKGS[k][1]+'\n').join('\n');
  }
  if(sub==='list-installed')return 'Listing... Done\n'+[...S.pkgs].sort().map(k=>M('g',k)+'/stable,now '+(PKGS[k]?PKGS[k][0]:'1.0')+' aarch64 [installed]').join('\n');
  if(sub==='list-all')return 'Listing... Done\n'+Object.keys(PKGS).sort().map(k=>M('g',k)+'/stable '+PKGS[k][0]+' aarch64'+(S.pkgs.has(k)?' [installed]':'')).join('\n');
  if(sub==='show'||sub==='info'){const p=rest[0];if(!PKGS[p])return `N: Unable to locate package ${p}`;return `Package: ${p}\nVersion: ${PKGS[p][0]}\nArchitecture: aarch64\nHomepage: https://packages.termux.dev\nDescription: ${PKGS[p][1]}`}
  if(sub==='autoclean'||sub==='clean')return 'Reading package lists... Done\n(cache cleaned)';
  if(sub==='files'){const p=rest[0];if(!S.pkgs.has(p))return `${p} is not installed`;return PREFIX+'/bin/'+p+'\n'+PREFIX+'/share/doc/'+p+'/copyright'}
  return `E: Invalid operation ${sub}`;
}

  rules[tgt].forEach(c=>{out.push(c.replace(/^@/,''));if(/^(clang|gcc|cc)\b/.test(c.replace(/^@/,''))){const r=cc(c.replace(/^@/,'').split(/\s+/).slice(1));if(r)out.push(r)}});return out.join('\n')},
 nmap:a=>nmapOut(a),
 openssl:a=>a[0]==='rand'?(a.includes('-hex')?hex(32):'(random bytes)'):a[0]==='version'?'OpenSSL 3.4.0 22 Oct 2024':'usage: openssl rand -hex 16 | version',
 jq:()=>M('w','(jq simulated)'),
 figlet:a=>'  _____ _____ ____  __  __ _   ___  __\n |_   _| ____|  _ \\|  \\/  | | | \\ \\/ /\n   | | |  _| | |_) | |\\/| | | | |\\  / \n   | | | |___|  _ <| |  | | |_| |/  \\ \n   |_| |_____|_| \\_\\_|  |_|\\___//_/\\_\\',
 cowsay:a=>{const t=a.join(' ')||'moo';return ` ${'_'.repeat(t.length+2)}\n< ${t} >\n ${'-'.repeat(t.length+2)}\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`},
 tmux:()=>M('w','(tmux would take over the screen — simulated: use Ctrl+B then D to detach on a real device)'),
 zsh:()=>M('w','(zsh would start — in this sim your shell stays bash)'),
 proot:()=>M('w','(simulated)'),
};
function cc(a){
  const src=a.filter(x=>/\.c$/.test(x));if(!src.length)return 'clang: error: no input files';
  const oi=a.indexOf('-o');const out=oi>=0?a[oi+1]:'a.out';
  const n=getNode(resolve(src[0]));if(!n)return `clang: error: no such file or directory: '${src[0]}'`;
  if(!/\bmain\s*\(/.test(n.d))return `ld: error: undefined symbol: main`;
  if(!/#include/.test(n.d)&&/printf/.test(n.d))return `${src[0]}:2:5: error: call to undeclared library function 'printf'\n  hint: add  #include <stdio.h>`;
  const f=file(n.d,'rwxr-xr-x');f.x='c';f.d=cOutput(n.d);writeFile(resolve(out),f.d);const nn=getNode(resolve(out));nn.m='rwxr-xr-x';nn.x='c';return '';
}
function pyRun(a){
  if(a[0]==='--version'||a[0]==='-V')return 'Python 3.12.8';
  if(a[0]==='-c')return runScript(a[1]||'','py');
  if(!a[0])return M('w','Python 3.12.8 (REPL not simulated). Try:  python -c "print(2+3)"   or run a script: python hello.py');
  const n=getNode(resolve(a[0]));if(!n)return `python: can't open file '${resolve(a[0])}': [Errno 2] No such file or directory`;
  return runScript(n.d,'py');
}

/* ================= executor ================= */
const evListeners=[];
async function runLine(line){
  const tk=tokenize(line);
  if(tk.err){print('bash: '+tk.err,'err');return}
  const toks=[];tk.toks.forEach(t=>{if(t.op)toks.push(t);else expandTok(t).forEach(v=>toks.push({v}))});
  // split into command lists by ; && ||
  const lists=[];let cur=[],joiner=';';
  const flush=()=>{if(cur.length)lists.push({toks:cur,joiner});cur=[]};
  for(const t of toks){ if(t.op===';'||t.op==='&&'||t.op==='||'){flush();joiner=t.op}else cur.push(t) }
  flush();
  let ok=true;
  for(let li=0;li<lists.length;li++){
    const L=lists[li];
    if(L.joiner==='&&'&&!ok)continue;
    if(L.joiner==='||'&&ok)continue;
    ok=await runPipeline(L.toks);
  }
}
async function runPipeline(toks){
  const segs=[[]];toks.forEach(t=>{if(t.op==='|')segs.push([]);else segs[segs.length-1].push(t)});
  let stdin='',ok=true;
  for(let i=0;i<segs.length;i++){
    let seg=segs[i],redir=null;
    const ri=seg.findIndex(t=>t.op==='>'||t.op==='>>');
    if(ri>=0){redir={op:seg[ri].op,f:seg[ri+1]&&seg[ri+1].v};seg=seg.slice(0,ri)}
    let argv=seg.map(t=>t.v);
    if(!argv.length)continue;
    const argv0=argv[0];if(S.alias[argv[0]]){const at=tokenize(S.alias[argv[0]]);if(at.toks)argv=at.toks.filter(t=>!t.op).map(t=>t.v).concat(argv.slice(1))}
    const name=argv[0],args=argv.slice(1);
    let res;const last=i===segs.length-1;S.piping=!last;const origName=argv0;
    try{ res=await exec(name,args,stdin) }catch(e){res='bash: internal error: '+e.message}
    let streamed=false;
    if(res&&typeof res==='object'&&res.__slow){
      if(last&&!redir){ for(const l of res.__slow){print(l);await sleep(85)} streamed=true; res=res.__slow.join('\n') }
      else res=res.__slow.join('\n');
    }
    if(res===null){ print(`bash: ${name}: command not found`,'err'); ok=false; fire(name,args,'',false); stdin=''; continue }
    if(res&&typeof res==='object'&&res.nf){ print(res.nf,'err'); ok=false; fire(name,args,'',false); stdin=''; continue }
    res=res||'';
    const bad=/^(bash: |[\w.-]+: (cannot|missing|invalid|failed|No such|fatal)|fatal:|E: |ls: |cat: |rm: |cp: |mv: |mkdir: |python: |grep: |clang: |ld: |make: \*\*\*|nano: |tar: |chmod: |touch: |rmdir: |find: |head: |tail: |wc: |ping: |pip.*ERROR|ERROR:|usage:|git: )/i.test(strip(res).trim());
    if(bad)ok=false;
    if(redir){
      if(!redir.f){print('bash: syntax error near unexpected token `newline\'','err');return false}
      const wr=writeFile(resolve(redir.f),strip(res).replace(/\u0000$/,'')+(res.endsWith('\u0000')?'':'\n'),redir.op==='>>');
      if(wr){print(`bash: ${redir.f}: ${wr}`,'err');ok=false}
      res='';
    }
    if(last){ if(!streamed&&res!==''){ const nonl=res.endsWith('\u0000'); const txt=nonl?res.slice(0,-1):res; strip(txt).length||txt.length?print(txt,bad?'err':''):0 } }
    else stdin=strip(res).replace(/\u0000$/,'');
    S.piping=false;fire(origName,args,strip(res),!bad,line_of(toks));
  }
  return ok;
}
function line_of(toks){return toks.map(t=>t.op||t.v).join(' ')}
async function exec(name,args,stdin){
  if(name.startsWith('./')||name.startsWith('/')&&getNode(name)&&getNode(name).t==='f'){
    const n=getNode(resolve(name));if(!n)return `bash: ${name}: No such file or directory`;
    if(n.t==='d')return `bash: ${name}: Is a directory`;
    if(!n.m.includes('x'))return `bash: ${name}: Permission denied`;
    if(n.x==='c')return n.d;
    return M('w','(script executed — simulator runs only compiled C demos)');
  }
  if(CMD2PKG[name]&&!S.pkgs.has(CMD2PKG[name])){
    return {nf:`The program ${name} is not installed. Install it by executing:\n pkg install ${CMD2PKG[name]}`};
  }
  const f=C[name];
  if(!f)return null;
  return await f(args,stdin);
}
function fire(name,args,out,ok,line){evListeners.forEach(f=>f({name,args,out,ok,line,S}))}

/* ================= terminal input ================= */
function buildTerm(){
  term.innerHTML='<div id="inrow"><span class="prompt" id="pr"></span><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
  updatePrompt();
  print('Welcome to Termux!','cb');
  print('');
  print('Docs:       https://termux.dev/docs','dim');
  print('Community:  https://termux.dev/community','dim');
  print('');
  print('Working with packages:','dim');
  print(' - Search:  pkg search <query>','dim');
  print(' - Install: pkg install <package>','dim');
  print(' - Upgrade: pkg upgrade','dim');
  print('');
  print('Type `help` to see what this sandbox supports. Click green commands in the lesson to paste them.','dim');
  print('');
  $('#inp').addEventListener('keydown',onKey);
}
let hIdx=0,busy=false;
async function submit(){
  const inp=$('#inp');const line=inp.value;inp.value='';
  const row=document.createElement('div');row.className='ln';row.innerHTML=`<span class="prompt">${esc(prompt())}</span>${esc(line)}`;term.insertBefore(row,$('#inrow'));
  if(!line.trim()){return}
  S.hist.push(line);hIdx=S.hist.length;
  busy=true;$('#inrow').style.opacity=.4;
  try{await runLine(line)}catch(e){print('bash: '+e.message,'err')}
  busy=false;$('#inrow').style.opacity=1;updatePrompt();term.scrollTop=term.scrollHeight;$('#inp').focus();
}
function complete(){
  const inp=$('#inp');const v=inp.value;const parts=v.split(/\s+/);const w=parts[parts.length-1];
  let cands=[];
  if(parts.length===1){cands=[...Object.keys(C),...Object.keys(S.alias)].filter(k=>k.startsWith(w)&&(!CMD2PKG[k]||S.pkgs.has(CMD2PKG[k])))}
  else{
    const i=w.lastIndexOf('/');const dp=i>=0?w.slice(0,i+1):'';const pre=w.slice(i+1);
    const d=getNode(resolve(dp||'.'));if(d&&d.t==='d')cands=Object.keys(d.c).filter(k=>k.startsWith(pre)).map(k=>dp+k+(d.c[k].t==='d'?'/':''));
  }
  if(cands.length===1){parts[parts.length-1]=cands[0];inp.value=parts.join(' ')+(cands[0].endsWith('/')?'':' ')}
  else if(cands.length>1){print(prompt()+v,'dim');print(cands.map(c=>c.split('/').filter(Boolean).pop()||c).join('  '));
    let p=cands[0];cands.forEach(c=>{while(!c.startsWith(p))p=p.slice(0,-1)});if(p.length>w.length){parts[parts.length-1]=p;inp.value=parts.join(' ')}}
}
function onKey(e){
  if(busy&&!e.ctrlKey){e.preventDefault();return}
  if(e.key==='Enter'){e.preventDefault();submit()}
  else if(e.key==='Tab'){e.preventDefault();complete()}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hIdx>0){hIdx--;$('#inp').value=S.hist[hIdx]||''}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hIdx<S.hist.length){hIdx++;$('#inp').value=S.hist[hIdx]||''}}
  else if(e.ctrlKey&&e.key==='l'){e.preventDefault();C.clear()}
  else if(e.ctrlKey&&e.key==='c'&&!window.getSelection().toString()){e.preventDefault();print(prompt()+$('#inp').value+'^C','dim');$('#inp').value=''}
}
term.addEventListener('click',()=>{if(!window.getSelection().toString())$('#inp').focus()});
$('#keys').addEventListener('click',e=>{
  const k=e.target.dataset.k;if(!k)return;const inp=$('#inp');
  if(k==='Tab')complete();
  else if(k==='ArrowUp')onKey({key:'ArrowUp',preventDefault(){}});
  else if(k==='ArrowDown')onKey({key:'ArrowDown',preventDefault(){}});
  else if(k==='ctrl-c')onKey({ctrlKey:true,key:'c',preventDefault(){}});
  else if(k==='ctrl-l')C.clear();
  else if(k==='Escape'){}
  else inp.value+=k;
  inp.focus();
});
function resetSandbox(){S=newState();buildTerm();$('#inp').focus()}
$('#rst-term').onclick=()=>{if(confirm('Reset the sandbox (files, packages, git repos)? Your task progress is kept.'))resetSandbox()};

{id:'install',icon:'1',title:'Installation',sub:'Get Termux the right way',
 body:`<p>Termux is a terminal emulator and Linux environment for Android. No root required. It gives you a real shell, a package manager and compilers on your phone.</p>
 <h3>Install the updated way</h3>
 <ul><li><b>F-Droid</b> (recommended) — <code>f-droid.org</code>, search "Termux".</li><li><b>GitHub Releases</b> — <code>github.com/termux/termux-app/releases</code>. Pick the APK for your CPU (usually <code>arm64-v8a</code>).</li></ul>
 <div class="note"><b>Avoid the Google Play build.</b> It is outdated and its package repos are no longer maintained, so installs and updates will fail. Install all Termux add-ons (Termux:API, Termux:Styling…) from the <i>same</i> source as the main app — mixing sources breaks signature checks.</div>
 <h3>First launch</h3>
 <p>Termux unpacks a bootstrap system (a minimal root filesystem) on first run. Your prompt looks like <code>~ $</code> — <code>~</code> is your home, <code>$</code> means a normal user.</p>
 <h3>Where things live</h3>
 ${blk(['$HOME   = /data/data/com.termux/files/home','$PREFIX = /data/data/com.termux/files/usr'])}
 <p>There is no <code>/bin</code> or <code>/usr</code> like on a PC — everything is under <code>$PREFIX</code>. That is why scripts use <code>#!/data/data/com.termux/files/usr/bin/bash</code> or <code>#!/usr/bin/env bash</code>.</p>`,
 tasks:[
  {t:'Show information about your Termux install',h:'termux-info',c:e=>is(e,'termux-info')},
  {t:'Print the kernel/system info',h:'uname -a',c:e=>is(e,'uname')},
  {t:'Print where $PREFIX points',h:'echo $PREFIX',c:e=>is(e,'echo')&&e.args.join(' ').includes('/usr')},
 ]},
{id:'setup',icon:'2',title:'Setup & Storage',sub:'Permissions, mirrors, first update',
 body:`<h3>Give Termux access to your files</h3>
 <p>By default Termux can only see its own private folder. To reach photos, downloads and documents, run:</p>
 ${blk(['termux-setup-storage'])}
 <p>Android shows a permission prompt — tap <b>Allow</b>. Termux then creates <code>~/storage</code> with shortcuts:</p>
 <ul><li><code>shared</code> – your internal storage root</li><li><code>downloads</code>, <code>dcim</code>, <code>pictures</code>, <code>music</code>, <code>movies</code></li></ul>
 <h3>Pick a fast mirror</h3>
 <p><code>termux-change-repo</code> opens a menu to choose a mirror near you — worth doing if <code>pkg update</code> feels slow or errors with "unreachable".</p>
 <h3>Reload after config edits</h3>
 <p>Changes to <code>~/.termux/termux.properties</code> (extra keys, bell, etc.) need <code>termux-reload-settings</code>.</p>
 <div class="note ok"><b>Tip:</b> Press <b>Tab</b> to autocomplete commands and file names. Use ↑/↓ for history.</div>`,
 tasks:[
  {t:'Grant storage access',h:'termux-setup-storage',c:e=>S.storage},
  {t:'List the storage shortcuts',h:'ls ~/storage',c:e=>is(e,'ls')&&S.storage&&e.args.join(' ').includes('storage')},
  {t:'Go to your Downloads folder and list it',h:'cd ~/storage/downloads && ls',c:e=>is(e,'ls')&&S.cwd.endsWith('/storage/downloads')||(e.name==='ls'&&S.cwd.endsWith('/Download'))},
  {t:'Return home',h:'cd',c:e=>S.storage&&S.cwd===HOME&&e.name==='cd'},
 ]},
{id:'pkg',icon:'3',title:'Package Management',sub:'pkg and apt explained',
 body:`<p>Termux is Debian-style: software ships as <code>.deb</code> packages managed by <code>apt</code>. <code>pkg</code> is a friendly wrapper around <code>apt</code> that also picks mirrors and runs updates for you.</p>
 ${blk(['pkg update            # refresh package lists','pkg upgrade           # upgrade everything installed','pkg install tree     # install a package','pkg search python     # find packages','pkg list-installed    # what you have','pkg show git          # details for one package','pkg uninstall tree   # remove'])}
 <h3>pkg vs apt</h3>
 <ul><li><code>pkg</code> — recommended for beginners; handles mirror selection, single keyword commands.</li><li><code>apt</code> — more control (<code>apt list --upgradable</code>, <code>apt policy</code>). Same underlying system, so both work.</li></ul>
 <div class="note"><b>Habit:</b> run <code>pkg update &amp;&amp; pkg upgrade</code> before installing anything big. Skipping this causes most "package not found" and library mismatch errors. Add <code>-y</code> to auto-accept prompts.</div>`,
 tasks:[
  {t:'Refresh the package lists',h:'pkg update',c:e=>is(e,'pkg','update')||is(e,'apt','update')},
  {t:'Upgrade installed packages',h:'pkg upgrade',c:e=>is(e,'pkg','upgrade')||is(e,'apt','upgrade')},
  {t:'Search for a package',h:'pkg search python',c:e=>is(e,'pkg','search')||is(e,'apt','search')},
  {t:'Install the tree utility',h:'pkg install tree',c:e=>has('tree')},
  {t:'See everything installed',h:'pkg list-installed',c:e=>is(e,'pkg','list-installed')},
 ]},
{id:'files',icon:'4',title:'Files & Directories',sub:'The commands you will use every day',
 body:`<h3>Navigate</h3>
 ${blk(['pwd            # where am I?','ls -la          # list all, long format','cd folder       # enter a folder','cd ..           # up one level','cd              # back home (also: cd ~)'])}
 <h3>Create, copy, move, delete</h3>
 ${blk(['mkdir -p a/b/c   # make nested folders','touch file.txt    # create empty file','cp a.txt b.txt     # copy (-r for folders)','mv old new         # move or rename','rm file             # delete file','rm -r folder        # delete folder (careful!)'])}
 <h3>Read &amp; write</h3>
 ${blk(['echo "hi" > f.txt     # overwrite','echo "more" >> f.txt   # append','cat f.txt             # print file','head -n 5 f.txt / tail -n 5 f.txt','grep -n "hi" f.txt     # search text','find . -name "*.txt"  # find files','nano f.txt             # edit'])}
 <p><code>|</code> pipes one command's output into another: <code>ls | wc -l</code> counts items.</p>
 <div class="note"><b>No recycle bin.</b> <code>rm</code> is permanent. Tab-complete paths, and never run <code>rm -rf</code> with a variable you have not echoed first.</div>`,
 tasks:[
  {t:'Make nested folders projects/demo',h:'mkdir -p projects/demo',c:e=>getNode(HOME+'/projects/demo')},
  {t:'Enter projects/demo',h:'cd projects/demo',c:e=>S.cwd===HOME+'/projects/demo'},
  {t:'Create hello.txt containing text using echo and >',h:'echo "Hello Termux" > hello.txt',c:e=>isFile(HOME+'/projects/demo/hello.txt')&&getNode(HOME+'/projects/demo/hello.txt').d.trim().length>0},
  {t:'Read it back with cat',h:'cat hello.txt',c:e=>is(e,'cat')&&e.out.includes('Hello')||(is(e,'cat')&&e.out.length>0)},
  {t:'Copy hello.txt to copy.txt',h:'cp hello.txt copy.txt',c:e=>isFile(HOME+'/projects/demo/copy.txt')},
  {t:'Rename copy.txt to renamed.txt',h:'mv copy.txt renamed.txt',c:e=>isFile(HOME+'/projects/demo/renamed.txt')&&!getNode(HOME+'/projects/demo/copy.txt')},
  {t:'Delete renamed.txt',h:'rm renamed.txt',c:e=>is(e,'rm')&&!getNode(HOME+'/projects/demo/renamed.txt')},
  {t:'Pipe: count entries with ls | wc -l',h:'ls | wc -l',c:e=>e.name==='wc'&&e.ok&&/\|/.test(e.line||'')||(e.name==='wc'&&e.ok)},
 ]},
{id:'git',icon:'5',title:'Git & GitHub',sub:'Version control on your phone',
 body:`<h3>Install &amp; identify yourself</h3>
 ${blk(['pkg install git','git config --global user.name "Your Name"','git config --global user.email "you@example.com"'])}
 <h3>The core loop</h3>
 ${blk(['git init              # start a repo in the current folder','git status            # what changed?','git add .             # stage changes','git commit -m "msg"   # save a snapshot','git log --oneline     # history'])}
 <h3>GitHub</h3>
 ${blk(['git clone https://github.com/user/repo.git','git remote add origin <url>','git push -u origin main'])}
 <p>GitHub no longer accepts account passwords for pushes. Use a <b>Personal Access Token</b> (as the password) or an <b>SSH key</b> (Module 7). Never paste tokens into scripts you commit.</p>
 <div class="note ok"><b>Tip:</b> add a <code>.gitignore</code> early — keep secrets, <code>node_modules/</code> and <code>__pycache__/</code> out of history.</div>`,
 tasks:[
  {t:'Install git',h:'pkg install git',c:e=>has('git')},
  {t:'Set your git user.name',h:'git config --global user.name "Your Name"',c:e=>!!S.gitcfg['user.name']},
  {t:'Set your git user.email',h:'git config --global user.email "you@example.com"',c:e=>!!S.gitcfg['user.email']},

  {t:'Stage everything',h:'git add .',c:e=>is(e,'git','add')},

  {t:'View history',h:'git log',c:e=>is(e,'git','log')},
 ]},
{id:'python',icon:'6',title:'Python Setup & Dev',sub:'Scripts, pip and virtual envs',
 body:`${blk(['pkg install python','python --version','pip --version'])}
 <p>Write a script and run it:</p>
 ${blk(['echo \'print("Hello from Termux")\' > hello.py','python hello.py'])}
 <p>Or open <code>nano hello.py</code>, type code, <b>Ctrl+O</b> to save, <b>Ctrl+X</b> to exit.</p>
 <h3>Libraries</h3>
 ${blk(['pip install requests','python -m venv venv      # isolated environment','source venv/bin/activate'])}
 <div class="note"><b>Heavy packages:</b> <code>numpy</code>, <code>scipy</code>, <code>pandas</code> compile slowly via pip. Prefer Termux builds: <code>pkg install python-numpy</code>. Don't run <code>pip install --upgrade pip</code> — Termux manages pip itself and it can break.</div>

{id:'net',icon:'7',title:'SSH & Networking',sub:'Remote access, keys and diagnostics',
 body:`${blk(['pkg install openssh net-tools'])}
 <h3>Connect out</h3>
 ${blk(['ssh user@server.example.com','ssh -p 2222 user@host     # custom port','scp file.txt user@host:~/'])}
 <h3>Key-based login (do this instead of passwords)</h3>
 ${blk(['ssh-keygen -t ed25519','ssh-copy-id user@host        # install your public key','cat ~/.ssh/id_ed25519.pub'])}
 <h3>Turn your phone into an SSH server</h3>
 ${blk(['passwd      # set a password','sshd         # listens on port 8022','whoami       # your username, needed to connect'])}
 <p>From a PC on the same Wi-Fi: <code>ssh -p 8022 USER@PHONE_IP</code>. Find the IP with <code>ifconfig</code> or <code>ip addr</code>.</p>
 <h3>Diagnostics</h3>
 ${blk(['ping -c 4 google.com','curl -I https://example.com','curl ifconfig.me       # public IP','ifconfig / ip addr'])}`,
 tasks:[
  {t:'Install openssh and net-tools',h:'pkg install openssh net-tools',c:e=>has('openssh')&&has('net-tools')},
  {t:'Generate an ed25519 key pair',h:'ssh-keygen -t ed25519',c:e=>isFile(HOME+'/.ssh/id_ed25519')},
  {t:'Print your public key',h:'cat ~/.ssh/id_ed25519.pub',c:e=>is(e,'cat')&&e.out.includes('ssh-ed25519')},
  {t:'Set a password and start the SSH server',h:'passwd',c:e=>S.passwd&&S.sshd},
  {t:'Find your phone\'s IP address',h:'ifconfig',c:e=>is(e,'ifconfig')||is(e,'ip')},
  {t:'Ping a host (4 packets)',h:'ping -c 4 google.com',c:e=>is(e,'ping')},
 ]},
{id:'mon',icon:'8',title:'System Monitoring',sub:'CPU, memory, storage, processes',
 body:`${blk(['top          # live process list (q to quit)','htop         # nicer, needs: pkg install htop','free -h       # memory','df -h         # disk space','uptime        # load averages','ps            # your processes','neofetch      # pretty summary (pkg install neofetch)','termux-battery-status   # needs termux-api'])}
 <h3>Reading the numbers</h3>
 <ul><li><b>Load average</b> (three numbers) = demand over 1/5/15 min. Stay below your core count.</li><li><b>free</b> column vs <b>available</b>: Linux uses spare RAM as cache, so judge by <i>available</i>.</li><li><b>Use%</b> in <code>df</code> above ~90% → clear space (<code>pkg clean</code>, <code>du -sh *</code>).</li></ul>
 <div class="note">Android can kill background Termux sessions. Pull down the notification and tap <b>Acquire wakelock</b> (or run <code>termux-wake-lock</code>) for long jobs, and exempt Termux from battery optimisation.</div>`,
 tasks:[
  {t:'Show running processes with top',h:'top',c:e=>is(e,'top')},
  {t:'Check memory in human units',h:'free -h',c:e=>is(e,'free')},
  {t:'Check disk space',h:'df -h',c:e=>is(e,'df')},
  {t:'Check uptime & load',h:'uptime',c:e=>is(e,'uptime')},
  {t:'List your processes',h:'ps',c:e=>is(e,'ps')},
  {t:'Install and run htop',h:'pkg install htop && htop',c:e=>is(e,'htop')},
 ]},
{id:'dev',icon:'9',title:'Development Tools',sub:'Node.js, C, Clang and Make',
 body:`${blk(['pkg install nodejs clang make'])}
 <h3>Node.js</h3>
 ${blk(['node -v','node -e "console.log(2+3)"','echo \'console.log("hi from node")\' > app.js','node app.js','npm install express'])}
 <h3>C with Clang</h3>
 <p>Create <code>hello.c</code> (use <code>nano hello.c</code>):</p>
 <pre class="blk">#include &lt;stdio.h&gt;
int main(void){
    printf("Hello, C!\\n");
    return 0;
}</pre>
 ${blk(['clang hello.c -o hello','./hello'])}
 <p><code>gcc</code> is simply an alias for clang in Termux. <code>./hello</code> works because the file is executable (<code>chmod +x</code> is automatic for compiler output).</p>
 <h3>Make</h3>
 <p>A <code>Makefile</code> automates builds. Recipe lines <b>must start with a TAB</b>.</p>
 <pre class="blk">all:
	clang hello.c -o hello</pre>
 <p>Run with <code>make</code>. Also available: <code>cmake</code>, <code>golang</code>, <code>rust</code>, <code>ruby</code>.</p>`,
 tasks:[
  {t:'Install nodejs, clang and make',h:'pkg install nodejs clang make',c:e=>has('nodejs')&&has('clang')&&has('make')},
  {t:'Check the Node version',h:'node -v',c:e=>is(e,'node')&&/^v\d/.test(e.out)},
  {t:'Write hello.c with nano (or echo)',h:'nano hello.c',c:e=>{let f=false;walk(HOME,(rel,n)=>{if(n.t==='f'&&rel.endsWith('hello.c')&&/main/.test(n.d))f=true});return f}},
  {t:'Compile it',h:'clang hello.c -o hello',c:e=>{let f=false;walk(HOME,(rel,n)=>{if(n.t==='f'&&n.x==='c')f=true});return f}},
  {t:'Run the program',h:'./hello',c:e=>e.name.startsWith('./')&&e.ok&&e.out.length>0},
 ]},
{id:'sec',icon:'10',title:'Ethical Security Tools',sub:'Educational use only — know the rules',
 body:`<div class="note"><b>Rules first.</b> Only test systems <b>you own</b> or have <b>explicit written permission</b> to test. Unauthorised scanning or access is illegal in most countries (e.g. CFAA, Computer Misuse Act) regardless of intent. This module is defensive: learn what attackers can see so you can close it.</div>
 <h3>Know your own exposure with nmap</h3>
 ${blk(['pkg install nmap','nmap localhost          # what is listening on this device?','nmap -sV localhost       # + service versions','nmap 192.168.1.1         # your own router (only if yours)'])}
 <p>An open port is a running service. If you don't need it, stop it. If you do, protect it (keys, firewall, updates).</p>
 <h3>Defender habits</h3>
 <ul><li>Scan yourself after starting a service (<code>sshd</code> → port <b>8022</b>) to confirm what is exposed.</li><li>Practise legally: your own home lab, <code>scanme.nmap.org</code> (within its rules), or deliberately vulnerable VMs like DVWA / HackTheBox / TryHackMe.</li><li>Generate strong secrets: <code>openssl rand -hex 16</code> (<code>pkg install openssl-tool</code>).</li><li>Check passwords you reuse at <i>haveibeenpwned.com</i>.</li></ul>
 <p><i>Sim note:</i> the sandbox only "scans" <code>localhost</code> or <code>192.168.x.x</code>; other targets are refused on purpose.</p>`,
 tasks:[
  {t:'Install nmap',h:'pkg install nmap',c:e=>has('nmap')},
  {t:'Scan your own device',h:'nmap localhost',c:e=>is(e,'nmap')&&/localhost|127/.test(e.args.join(' '))},
  {t:'Start sshd, then scan again and spot port 8022',h:'sshd && nmap localhost',c:e=>is(e,'nmap')&&S.sshd&&/8022/.test(e.out)},
  {t:'Generate a strong random secret (install openssl-tool first)',h:'pkg install openssl-tool && openssl rand -hex 16',c:e=>is(e,'openssl')&&e.args[0]==='rand'},
 ]},
{id:'custom',icon:'11',title:'Customization & Productivity',sub:'Aliases, .bashrc, extra keys, themes',
 body:`<h3>Shell startup: ~/.bashrc</h3>
 <p>Runs on every new session — put aliases and exports here:</p>
 ${blk(['echo "alias ll=\'ls -la\'" >> ~/.bashrc','echo "alias update=\'pkg update && pkg upgrade -y\'" >> ~/.bashrc','source ~/.bashrc      # apply now'])}
 <h3>Extra keys row &amp; behaviour</h3>
 <p><code>mkdir -p ~/.termux</code> then edit <code>~/.termux/termux.properties</code>:</p>
 <pre class="blk">extra-keys = [['ESC','TAB','CTRL','ALT','-','/','|','UP'], \\
              ['~','HOME','END','PGUP','PGDN','LEFT','DOWN','RIGHT']]</pre>
 <p>Apply with <code>termux-reload-settings</code>. Long-press the screen → <b>Style</b> for colours/fonts, or install <b>Termux:Styling</b>.</p>
 <h3>Nice-to-haves</h3>
 <ul><li><code>neofetch</code> / <code>fastfetch</code> – system banner</li><li><code>tmux</code> – split panes, persistent sessions</li><li><code>zsh</code> + oh-my-zsh – richer prompt</li><li><code>termux-api</code> – scripts that use battery, clipboard, SMS, camera (with permissions)</li><li>Edit <code>$PREFIX/etc/motd</code> to change the welcome text.</li></ul>`,
 tasks:[
  {t:'Add an alias to ~/.bashrc',h:'echo "alias ll=\'ls -la\'" >> ~/.bashrc',c:e=>{const n=getNode(HOME+'/.bashrc');return n&&/alias/.test(n.d)}},
  {t:'Apply it with source',h:'source ~/.bashrc',c:e=>is(e,'source')&&Object.keys(S.alias).length>0},
  {t:'Use your new alias',h:'ll',c:e=>Object.keys(S.alias).includes(e.name)&&e.ok},
  {t:'Create the ~/.termux config folder',h:'mkdir -p ~/.termux',c:e=>getNode(HOME+'/.termux')},
  {t:'Install and run neofetch',h:'pkg install neofetch && neofetch',c:e=>is(e,'neofetch')},
 ]},
{id:'best',icon:'12',title:'Pro Practices & Security',sub:'Habits that keep your setup safe and stable',
 body:`<h3>Security</h3>
 <ul><li><b>Read before you run.</b> Never pipe unknown scripts into a shell (<code>curl … | bash</code>). Download, <code>cat</code> it, then run.</li><li><b>Lock down secrets:</b> <code>chmod 600 ~/.ssh/id_ed25519</code> — private keys must be readable only by you. <code>ls -l</code> to verify.</li><li><b>Keys over passwords</b> for SSH; disable password login once keys work.</li><li><b>Keep updated:</b> <code>pkg update &amp;&amp; pkg upgrade</code> weekly.</li><li>Only install from official repos / F-Droid. Be wary of "hacking tool" repos — many are malware.</li><li>Don't store tokens in shell history; use environment files with 600 permissions.</li></ul>
 <h3>Stability &amp; backup</h3>
 ${blk(['tar -czf ~/backup.tar.gz projects      # archive your work','cp ~/backup.tar.gz ~/storage/shared/     # copy off-app (needs storage setup)','termux-wake-lock                       # keep long jobs alive','history | grep pkg                     # recall commands'])}
 <ul><li>Uninstalling Termux or "Clear data" <b>erases</b> everything in <code>$HOME</code> — back up first.</li><li>Use <code>git</code> for code, <code>tar</code> for snapshots.</li><li>Avoid <code>rm -rf</code> with wildcards; prefer <code>rm -ri</code> when unsure.</li><li>Prefer <code>$PREFIX</code> and relative paths in scripts so they stay portable.</li></ul>
 <div class="note ok"><b>You've reached the end of the course.</b> Take the Quiz tab to test yourself, and keep the Reference tab handy.</div>`,
 tasks:[
  {t:'Lock down a private file (create one first if needed)',h:'chmod 600 ~/.ssh/id_ed25519',c:e=>is(e,'chmod')&&e.args.includes('600')},
  {t:'Verify permissions with ls -l',h:'ls -l ~/.ssh',c:e=>is(e,'ls')&&e.args.some(a=>/^-.*l/.test(a))&&/rw-------/.test(e.out)},
  {t:'Create a backup archive',h:'cd && tar -czf ~/backup.tar.gz projects',c:e=>is(e,'tar')&&isFile(HOME+'/backup.tar.gz')},
  {t:'Search your command history',h:'history | grep pkg',c:e=>is(e,'grep')&&/pkg/.test(e.args.join(' '))},
 ]},
];

let done=store.get('termuxSim.v1',{});

let cur=store.get('termuxSim.cur',0);
function saveProg(){store.set('termuxSim.v1',done)}
function modDone(i){return LESSONS[i].tasks.every((_,j)=>done[i+'.'+j])}
evListeners.push(ev=>{
  let changed=false;const wasDone=modDone(cur);
  LESSONS.forEach((l,i)=>l.tasks.forEach((t,j)=>{
    const k=i+'.'+j;if(done[k])return;
    try{if(t.c(ev)){done[k]=1;changed=true}}catch(e){}
  }));
  if(changed){saveProg();renderTasks();renderSide();updateProg();if(!wasDone&&modDone(cur))print(M('g','✔ Module complete: '+LESSONS[cur].title)+' — open the next lesson when ready.')}
});
function updateProg(){const d=doneCount(),t=total();$('#ptxt').textContent=`${d} / ${t} tasks`;$('#pbar').style.width=(100*d/t)+'%'}

function renderSide(){
  $('#side').innerHTML=LESSONS.map((l,i)=>`<button class="mod ${i===cur?'on':''} ${modDone(i)?'done':''}" data-i="${i}"><span class="n">${modDone(i)?'✓':l.icon}</span><div><b>${esc(l.title)}</b><span class="s">${esc(l.sub)}</span></div></button>`).join('');
}
function renderTasks(){
  const l=LESSONS[cur];const el=$('#tasks');if(!el)return;
  el.innerHTML=`<b>Your tasks</b> <span style="color:var(--mute)">(${l.tasks.filter((_,j)=>done[cur+'.'+j]).length}/${l.tasks.length})</span>`+l.tasks.map((t,j)=>`<div class="task ${done[cur+'.'+j]?'done':''}"><div class="ck">${done[cur+'.'+j]?'✓':''}</div><div style="flex:1"><div class="tx">${esc(t.t)}</div><div class="hint" id="h${j}">${esc(t.h)}</div></div><button class="ghost hintb" data-h="${j}">hint</button></div>`).join('');
  $('#next').disabled=cur>=LESSONS.length-1;
}
function renderLesson(){
  const l=LESSONS[cur];
  $('#lesson').innerHTML=`<div style="color:var(--mute);font-size:12px;font-family:var(--mono)">MODULE ${cur+1} OF ${LESSONS.length}</div><h2>${esc(l.title)}</h2><p class="sub">${esc(l.sub)}</p>${l.body}<div class="tasks" id="tasks"></div><div class="pager"><button class="btn sec" id="prev" ${cur===0?'disabled':''}>← Previous</button><button class="btn" id="next">Next module →</button></div>`;
  $('#lesson').scrollTop=0;renderTasks();renderSide();
  $('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
}
function go(i){cur=Math.max(0,Math.min(LESSONS.length-1,i));store.set('termuxSim.cur',cur);renderLesson()}
$('#side').addEventListener('click',e=>{const b=e.target.closest('.mod');if(b)go(+b.dataset.i)});

  }
  const q=QZ[qs.i];const picked=qs.ans[qs.i];
  el.innerHTML=`<h2>Quiz</h2><p style="color:var(--mute);margin:0 0 12px">Question ${qs.i+1} of ${QZ.length} · score ${qs.score}${qs.best?` · best ${qs.best}`:''}</p><div class="card"><h3 style="margin-top:0">${esc(q[0])}</h3>${q[1].map((o,k)=>`<button class="opt ${picked!==undefined?(k===q[2]?'right':k===picked?'wrong':''):''}" data-k="${k}" ${picked!==undefined?'disabled':''}>${esc(o)}</button>`).join('')}${picked!==undefined?`<div class="expl"><b>${picked===q[2]?'Correct.':'Not quite.'}</b> ${esc(q[3])}</div><div style="margin-top:14px"><button class="btn" id="qnext">${qs.i===QZ.length-1?'See results':'Next question'}</button></div>`:''}</div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;qs.ans[qs.i]=k;if(k===q[2])qs.score++;saveQ();renderQuiz()});
  const n=$('#qnext');if(n)n.onclick=()=>{qs.i++;saveQ();renderQuiz()};
}

$('#aboutpage').innerHTML=`<h2>About Terminal Trainer</h2><p style="color:var(--mute)">An interactive simulator for learning the Linux command line on Android, using the Termux environment as the example.</p>

<div id="sw-update" style="display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#22c55e;color:#04210f;font:700 14px system-ui,sans-serif;padding:10px 16px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.4);cursor:pointer">New version of Terminal SIM ready. Tap to update</div>
<script>
/* Install + auto-update layer (only when served over http/https, e.g. GitHub Pages) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const show=()=>{const b=document.getElementById('sw-update');b.style.display='block';b.onclick=()=>{reg.waiting&&reg.waiting.postMessage('skipWaiting');};};
      if(reg.waiting&&navigator.serviceWorker.controller)show();
      reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show();});});
      setInterval(()=>reg.update(),60*60*1000);
    }).catch(()=>{});
    let r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(r)return;r=true;location.reload();});
  });
}
</script>
